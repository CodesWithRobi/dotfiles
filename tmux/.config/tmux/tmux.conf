set -g default-terminal "tmux-256color"
set -a terminal-features "xterm-kitty:RGB"
set -as terminal-overrides "xterm-256color:RGB"
set -g escape-time 10
set -g extended-keys on
set -g xterm-keys on
set -g prefix C-SPACE
set -g base-index 1
set -g renumber-windows on
set -g mode-keys vi
set -g mouse on
set -g status-position top
set -g status-justify absolute-centre
set -g status-style "bg=default"
set -g window-status-current-style "fg=colour255,bg=default,bold"
set -g window-status-separator ""
set -g window-status-format "#[fg=colour240]#[default] #I:#W#{?window_flags,#{window_flags},} #[fg=colour240]#[default]"
set -g window-status-current-format "#[fg=#9288df] #I:#W#{?window_flags,#{window_flags},} #[default]"
set -g status-interval 5
set -g status-left "#S"
set -g status-right ""
# for debugging
set -g remain-on-exit "off"

bind r source-file "~/.config/tmux/tmux.conf"
bind x kill-window
bind-key -n M-BSpace send-keys C-w
bind-key -T root S-Enter send-keys S-Enter
bind f run "tmux neww ~/.config/scripts/tmux-session-dispensary.sh"
bind H run "~/.config/scripts/tmux-session-dispensary.sh ~"
bind L run "~/.config/scripts/tmux-session-dispensary.sh ~/.config"
unbind k
unbind s
unbind T
bind s run "tmux neww -c '#{pane_current_path}' -n scripts 'bash ~/.config/scripts/script-picker.sh \"#{pane_current_path}\"'"
bind G neww -n "git" -S lazygit
bind y neww -n "yazi" -S yazi
bind O run "tmux neww ~/.config/scripts/links-picker.sh"
bind g run "~/.config/scripts/open-github.sh"
bind e neww -S -n "LINKS" "nvim ~/.config/links.tsv"
bind E show-environment -g

# copy mode: explicitly bind C-M-j for scroll-down (C-j shadows it)
bind-key -T copy-mode-vi C-M-j send-keys -X scroll-down

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-dir '~/.config/tmux/resurrect'

run '~/.tmux/plugins/tpm/tpm'
